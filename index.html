:root {
  --ink: #17231f;
  --black: #14231e;
  --muted: #5e6b64;
  --faint: #889289;
  --line: #d9ded5;
  --cream: #f7f7f2;
  --panel: #fffefa;
  --side: #f0f2eb;
  --mint: #8ce4cc;
  --pale: #e1f2e9;
  --teal: #146352;
  --orange: #a65422;
  --mono: Plex, ui-monospace, SFMono-Regular, Consolas, monospace;
  --display: Space, DM, Arial, sans-serif;
  --sidew: 222px;
  color-scheme: light;
  font-family: DM, Arial, sans-serif;
  color: var(--ink);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
* {
  box-sizing: border-box;
}
html {
  min-height: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 20px;
}
body {
  margin: 0;
  background: var(--cream);
  font-size: 14px;
  line-height: 1.42;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button {
  border: 0;
  background: transparent;
}
a {
  color: inherit;
  text-decoration: none;
}
button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
button:not(:disabled),
a,
input,
textarea,
select {
  transition:
    background-color 0.14s,
    border-color 0.14s,
    color 0.14s,
    box-shadow 0.14s;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #16886e;
  outline-offset: 3px;
}
::selection {
  background: #a3ead8;
  color: #15261f;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: var(--display);
  line-height: 1.12;
}
svg {
  display: inline-block;
  flex-shrink: 0;
  vertical-align: middle;
}
.skip {
  position: fixed;
  top: -70px;
  left: 10px;
  z-index: 40;
  background: var(--ink);
  color: white;
  padding: 12px 18px;
}
.skip:focus {
  top: 10px;
}
.workspace {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidew) minmax(0, 1fr);
}
.stage {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.sidebar {
  height: 100dvh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  background: var(--side);
  border-right: 1px solid var(--line);
  padding: 30px 15px 14px;
  overflow-y: auto;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  text-align: left;
}
.sidebar .brand {
  margin: 0 5px 45px;
}
.brandmark {
  width: 36px;
  height: 36px;
}
.brand-word {
  font: 700 18px/0.98 var(--display);
  letter-spacing: -1.15px;
  color: #14221d;
}
.brand-caption {
  font: 500 8px/1.4 var(--mono);
  letter-spacing: 1.5px;
  margin-top: 5px;
  color: #59675e;
}
.section-label,
.micro,
.source,
.weekday,
.pill-mini {
  font: 500 10px/1.45 var(--mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.section-label {
  color: var(--muted);
  margin: 0 12px 11px;
  font-size: 9px;
  letter-spacing: 0.13em;
}
.sidenav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.navitem {
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: 7px;
  min-height: 42px;
  padding: 10px 13px;
  font-weight: 560;
  color: #536157;
  position: relative;
}
.navitem .icon {
  color: #58685f;
  stroke-width: 1.6;
}
.navitem:hover {
  background: #e5e9e1;
  color: var(--ink);
}
.navitem.active {
  background: #192922;
  color: #f6fbf6;
}
.navitem.active .icon {
  color: var(--mint);
}
.navitem.active:after {
  content: "";
  margin-left: auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--mint);
}
.navitem .ncount {
  margin-left: auto;
  padding: 1px 6px;
  border: 1px solid #cbd5c9;
  border-radius: 4px;
  font: 500 10px var(--mono);
  color: #58665b;
}
.navitem.active .ncount {
  border-color: #455a4d;
  color: var(--mint);
}
.navitem.active:has(.ncount):after {
  display: none;
}
.side-ref {
  margin-top: auto;
  padding: 38px 5px 18px;
}
.reference {
  display: block;
  border: 1px solid #cfd7cb;
  border-radius: 9px;
  background: #e9ede4;
  padding: 12px 13px 11px;
}
.reference:hover {
  background: #e0e8da;
}
.reference-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #597065;
}
.reference-title {
  display: block;
  margin-top: 8px;
  font-weight: 680;
  font-size: 13px;
}
.reference .micro {
  display: block;
  font-size: 8px;
  letter-spacing: 0.08em;
  margin-top: 2px;
  color: var(--muted);
}
.sidebar-foot {
  margin-top: 11px;
  padding: 14px 9px 0;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #646e64;
  font: 500 9px var(--mono);
  letter-spacing: 0.04em;
}
.status-dot,
.eyedot {
  display: inline-block;
  background: #3f916f;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-label {
  display: inline-flex;
  gap: 7px;
  align-items: center;
}

  padding: 14px 18px;
  border-bottom: 1px solid #e4e8df;

}

  overflow-wrap: anywhere;
}
.track-progress {
  display: flex;
  align-items: center;
  gap: 8px;
}
.track-progress .line-progress {
  width: 65%;
  max-width: 98px;
}
.track-progress small {
  font: 500 9px var(--mono);
  color: var(--muted);
}
.track-row .tag {
  justify-self: start;
}
.track-row > .icon {
  color: #798a7a;
}
.muted {
  color: var(--muted);
}
.pad {
  padding: 18px 20px;
}
.standard-para {

  line-height: 1.55;
}
.log-list {
  padding: 0 19px;
}
.log-item {
  display: flex;
  gap: 13px;
  padding: 15px 0;
  border-bottom: 1px solid #e5e9e1;
}
.log-item:last-child {
  border-bottom: 0;
}
.log-icon {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e6f2e9;
  color: #3a6855;
  flex-shrink: 0;
}
.log-icon.auto {
  background: #f1f2eb;
  color: #6c786d;
}
.log-body {
  min-width: 0;
  flex: 1;
}
.log-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
}
.log-text,
.note-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  color: #26392c;
  line-height: 1.5;
}
.log-next {
  font-size: 12px;
  line-height: 1.4;
  color: var(--muted);
  margin: 6px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.log-body .text-btn {
  font-size: 11px;
}
.log-edit {
  align-self: flex-start;
  width: 29px;
  height: 29px;
}
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  align-items: start;
}
.setting-body {
  padding: 0 20px 20px;
}
.setting-body p {
  margin: 0 0 13px;
}
.settings-grid .wide {
  grid-column: 1/-1;
}
.setting-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 13px;
}
.inline-note {
  padding: 10px 12px;
  border-left: 3px solid #91bfa8;
  background: #eff5ec;
  font-size: 12px;
  line-height: 1.5;
  color: #435c4b;
  margin: 10px 0;
}
.source {
  font-size: 9px;
  color: #64746a;
  letter-spacing: 0.045em;
}
.source a {
  text-decoration: underline;
  text-underline-offset: 2px;
}
.source-block {
  padding: 13px 20px;
  border-top: 1px solid var(--line);
  background: #f8f9f3;
}
.section-stack > * + * {
  margin-top: 14px;
}
.rd-progress {
  height: 5px;
  max-width: 130px;
}
.sheet {
  display: block;
}
.toast {
  position: fixed;
  right: 24px;
  bottom: 22px;
  z-index: 1000;
  color: #f6fff8;
  background: #192f25;
  border: 1px solid #345643;
  box-shadow: 0 6px 28px #20352d26;
  max-width: min(420px, calc(100vw - 32px));
  border-radius: 8px;
  padding: 12px 16px;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  font-size: 13px;
  transition:
    opacity 0.16s,
    transform 0.16s;
}
.toast.show {
  opacity: 1;
  transform: none;
}
.toast.error {
  background: #753c2e;
}
#sheet {
  color: var(--ink);
  background: var(--panel);
  padding: 0;
  border: 1px solid #c3cec0;
  border-radius: 13px;
  width: min(530px, calc(100vw - 28px));
  max-height: min(88dvh, 880px);
  box-shadow: 0 18px 100px #15241f39;
  overflow: auto;
  overscroll-behavior: contain;
}
#sheet.wide {
  width: min(640px, calc(100vw - 28px));
}
#sheet::backdrop {
  background: #13231ec2;
  backdrop-filter: blur(3px);
}
body:has(#sheet[open]) {
  overflow: hidden;
}
.sheet-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  padding: 21px 23px 16px;

  background: var(--panel);
  position: sticky;
  top: 0;
  z-index: 2;
}

  font-size: 26px;
  letter-spacing: -0.055em;
  margin-top: 6px;
  overflow-wrap: anywhere;
}
.sheet-head .icon-btn {
  width: 31px;
  height: 31px;
  flex-shrink: 0;
}
.sheet-body {
  padding: 19px 23px 22px;
}
.fields {
  display: grid;
  gap: 14px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  font-weight: 650;
  min-width: 0;
}
.field span small,
.field-hint {
  font-weight: 450;
  color: var(--muted);
  font-size: 11px;
}
.field textarea {
  resize: vertical;
  min-height: 75px;
  line-height: 1.45;
}
.twocol {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.fields select,
.fields input,
.fields textarea,
.setting-body input,
.setting-body select {
  font-weight: 450;
}
.form-error:empty {
  display: none;
}
.form-error:not(:empty) {
  font-size: 12px;
  margin-top: 10px;
}
.sheet-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 17px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.sheet-actions .left-action {
  margin-right: auto;
}
.detail-summary {
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
  margin-bottom: 15px;
}
.context-badges {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
  margin: 0 0 13px;
}
.fields .hint,
.helper {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}
.sheet-section {
  margin-top: 18px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.sheet-section h3 {
  font-size: 17px;
  letter-spacing: -0.035em;
  margin-bottom: 8px;
}
.sheet-section .log-list {
  padding: 0;
}
.stage-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stage-cell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 8px 9px;
  background: #f3f5ed;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  min-width: 0;
}
.stage-cell select {
  width: auto;
  max-width: 65%;
  min-height: 30px;
  font-size: 11px;
  padding: 5px 23px 5px 6px;
  background-position: right 4px center;
}
.form-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  word-break: break-all;
  color: var(--teal);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.danger-link {
  color: #9b4734;
}
.screen .mobile-only,
.mobile-only {
  display: none;
}
[hidden] {
  display: none !important;
}

.cover h2 em {
  font-family: Instrument, Georgia, serif;
  font-weight: 400;
  font-size: 1.22em;
  letter-spacing: -0.035em;
}
.dash-grid {
  align-items: stretch;
}
.dash-grid > .card {
  display: flex;
  flex-direction: column;
}
.dash-grid > .card .card-foot {
  margin-top: auto;
}
.h-preview {
  display: flex;
  flex: 1;
  flex-direction: column;
}
.mini-hito {
  flex: 1;
}
.tick:before {
  inset: -10px;
}
@media (max-width: 620px) {
  .cover-art {
    width: 74%;
  }
  .cover:before {
    background: linear-gradient(
      90deg,
      #101e18 0%,
      rgba(15, 29, 23, 0.98) 30%,
      rgba(14, 27, 21, 0.68) 54%,
      transparent 79%
    );
  }
  .page-head > .btn {
    min-height: 40px;
  }
}

/* Acceso ---------------------------------------------------------------
   Sin sesión no hay tablero: el plan se descarga después de entrar. */
body.puerta .sidebar,
body.puerta .topbar,
body.puerta .mobile-nav,
body.puerta .desk-foot {
  display: none;
}
body.puerta .workspace {
  grid-template-columns: minmax(0, 1fr);
}
body.puerta .stage {
  min-height: 100vh;
  justify-content: center;
}
body.puerta #main {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}
.gate-screen {
  max-width: 520px;
  padding: 0;
}
.gate-card {
  width: 100%;
  padding: clamp(24px, 4vw, 38px);
  display: grid;
  gap: 14px;
}
.gate-card h1 {
  font: 600 clamp(24px, 4vw, 30px) / 1.1 var(--display);
  letter-spacing: -0.03em;
  margin: 0;
}
.gate-card .helper,
.gate-card code {
  font-family: var(--mono);
  font-size: 11px;
}
.gate-card code {
  background: var(--side);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
}
.gate-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.gate-actions .btn {
  justify-content: center;
}
#form-login .btn {
  width: 100%;
  min-height: 44px;
}
